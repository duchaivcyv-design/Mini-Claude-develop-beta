name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REF: ${{ github.event.release.tag_name || inputs.ref || github.ref }}
      TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Set up Cross-Compilation Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl git unzip wget cmake libssl-dev dpkg ldid zip

      - name: Install Theos and iOS Toolchain for Linux
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/theos
          sudo chown -R $USER:$USER /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Cài đặt iOS SDK cho Theos trên Ubuntu
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C /opt/theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz

          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Toolchain info
        run: |
          set -euo pipefail
          echo "THEOS: $THEOS"
          dpkg --version
          ldid --version

      - name: Build IPA using repository build.sh
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh
          shopt -s nullglob
          ipa_files=(dist/*.ipa)
          if (( ${#ipa_files[@]} == 0 )); then
            echo "::error::build.sh completed but did not create an IPA in dist/."
            echo "Expected tools/make_ipa.sh to create dist/*.ipa."
            ls -la dist 2>/dev/null || true
            exit 1
          fi
          printf 'ipa=%s\n' "${ipa_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-mini-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA to GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ipa="$(find dist -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            echo "::error::No IPA found in dist/."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "GestaltX ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" "$ipa" --clobber
